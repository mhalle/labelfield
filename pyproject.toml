[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labelfield"
version = "0.1.2"
description = "labelfield: a per-class logit field to labels on any grid - trilinear interpolation, argmax and multi-model paint fused on the GPU"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
torch = ["torch>=2.1"]           # to_labels and the backends; Metal needs torch >= 2.7 and is skipped below it
cuda = ["triton>=3.0"]           # the CUDA kernel
test = ["pytest>=7", "torch>=2.1", "scipy>=1.9", "scikit-image>=0.19"]

[tool.hatch.build.targets.wheel]
packages = ["src/labelfield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs large fixtures or a GPU budget"]

[tool.ruff]
line-length = 120
target-version = "py39"
